<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join group — CampusSplit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .join-card {
      max-width: 420px;
      margin: 0 auto;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      padding: 36px;
      text-align: center;
    }
    .join-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .join-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(108,99,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 18px;
    }
    .join-card h2 {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .join-card p {
      font-size: 0.88rem;
      color: var(--c-text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .join-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--c-text-dim);
      margin-bottom: 20px;
    }
    .join-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--c-border);
      border-top-color: var(--c-primary);
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="join-wrap">
    <div class="join-card" id="joinCard">
      <div class="join-spinner" id="joinSpinner"></div>
      <p style="margin-top:16px;">Checking invite link…</p>
    </div>
  </div>

  <script type="module" src="js/groups/join-group.js"></script>
</body>
</html>
